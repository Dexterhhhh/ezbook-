name: ezbook-magic

services:
  ezbookkeeping:
    image: ${IMAGE_NAME:-ezbook-magic}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-local}
    restart: unless-stopped
    environment:
      EBK_SECRET_KEY: ${EBK_SECRET_KEY:?set EBK_SECRET_KEY in .env}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - ezbookkeeping_data:/ezbookkeeping/data
      - ezbookkeeping_storage:/ezbookkeeping/storage
      - ezbookkeeping_log:/ezbookkeeping/log
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  ezbookkeeping_data:
  ezbookkeeping_storage:
  ezbookkeeping_log:
